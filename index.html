<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Clone Demo</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            background-color: #000;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #333;
            position: relative;
            overflow: hidden;
        }

        #multiplier {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0;
            color: #fff;
        }

        .plane-area {
            height: 150px;
            position: relative;
            border-bottom: 2px solid #ff003c;
            margin-bottom: 20px;
        }

        #plane {
            position: absolute;
            bottom: 0;
            left: 0;
            font-size: 30px;
            transition: transform 0.1s linear;
        }

        .bet-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            text-align: center;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .bet-btn { background-color: #28a745; color: white; }
        .cashout-btn { background-color: #ffc107; color: black; display: none; }
        .reset-btn { background-color: #dc3545; color: white; display: none; }

        .status { color: #ff003c; font-weight: bold; height: 20px; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="status" id="status"></div>
        <div class="plane-area">
            <div id="plane">✈️</div>
        </div>
        <div id="multiplier">1.00x</div>

        <div class="bet-section">
            <input type="number" id="betAmount" value="100" placeholder="Kiasi cha dau">
            <button id="mainBtn" class="bet-btn" onclick="startGame()">WEKA DAU (BET)</button>
            <button id="cashoutBtn" class="cashout-btn" onclick="cashOut()">TOA PESA (CASH OUT)</button>
        </div>
    </div>

    <script>
        let multiplier = 1.00;
        let isRunning = false;
        let crashPoint = 0;
        let interval;

        const multiplierDisplay = document.getElementById('multiplier');
        const plane = document.getElementById('plane');
        const status = document.getElementById('status');
        const mainBtn = document.getElementById('mainBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');

        function startGame() {
            if (isRunning) return;

            // Maandalizi ya mchezo
            multiplier = 1.00;
            isRunning = true;
            status.innerText = "";
            // Hapa ndipo "Algorithm" inapoamua ndege itapasuka lini (Random)
            crashPoint = (Math.random() * 5 + 1).toFixed(2); 

            mainBtn.style.display = "none";
            cashoutBtn.style.display = "block";

            interval = setInterval(() => {
                multiplier += 0.01;
                multiplierDisplay.innerText = multiplier.toFixed(2) + "x";
                
                // Ndege kusogea juu
                let position = (multiplier - 1) * 30;
                plane.style.transform = `translate(${position}px, -${position}px)`;

                // Angalia kama imepasuka (Crash)
                if (multiplier >= crashPoint) {
                    endGame(false);
                }
            }, 100);
        }

        function cashOut() {
            if (!isRunning) return;
            endGame(true);
        }

        function endGame(won) {
            clearInterval(interval);
            isRunning = false;
            
            if (won) {
                status.style.color = "#28a745";
                status.innerText = "USHINDI! Umepata: " + (document.getElementById('betAmount').value * multiplier).toFixed(2);
            } else {
                status.style.color = "#ff003c";
                status.innerText = "NDEGE IMEPAA! (CRASHED)";
                multiplierDisplay.style.color = "#ff003c";
            }

            setTimeout(() => {
                resetGame();
            }, 3000);
        }

        function resetGame() {
            multiplier = 1.00;
            multiplierDisplay.innerText = "1.00x";
            multiplierDisplay.style.color = "#fff";
            plane.style.transform = `translate(0, 0)`;
            mainBtn.style.display = "block";
            cashoutBtn.style.display = "none";
            status.innerText = "Subiri raundi nyingine...";
        }
    </script>
</body>
</html>
